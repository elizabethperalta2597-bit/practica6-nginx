<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 6 - Nginx con Docker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #6d28d9);
            color: #ffffff;
        }

        .tarjeta {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 48px 56px;
            text-align: center;
            max-width: 520px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e7ff;
        }

        .etiqueta {
            display: inline-block;
            margin-top: 24px;
            padding: 8px 18px;
            border-radius: 999px;
            background: #ffffff;
            color: #1e3a8a;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>Hola mundo</h1>
        <p>Servidor Nginx corriendo con Docker Compose.</p>
        <span class="etiqueta">Practica 6</span>
    </div>
</body>
</html>
